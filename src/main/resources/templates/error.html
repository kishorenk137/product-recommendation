<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/main :: head('Error - InsightsAI')}"></head>
<body class="bg-light">
<div class="d-flex align-items-center justify-content-center min-vh-100 p-4">
    <div class="card border-0 shadow-sm rounded-4 text-center p-5" style="max-width: 520px; width: 100%;">
        <div class="display-1 fw-bold text-danger mb-2" th:text="${errorCode != null ? errorCode : 500}">404</div>
        <h4 class="fw-bold text-dark mb-2" th:text="${errorTitle != null ? errorTitle : 'Unexpected Error'}">Page Not Found</h4>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested resource or page was not found.'}">
            The requested page or record could not be located.
        </p>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
</body>
</html>
