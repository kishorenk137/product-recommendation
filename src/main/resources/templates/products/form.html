<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/main :: head(${isEdit ? 'Edit Product' : 'Add New Product'})}"></head>
<body>
<div class="app-container">
    <aside th:replace="~{layout/main :: sidebar}"></aside>

    <div class="app-main">
        <header th:replace="~{layout/main :: topbar}"></header>
        <div th:replace="~{layout/main :: alerts}"></div>

        <main class="app-content">
            <!-- Breadcrumbs -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}" class="text-decoration-none">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/products}" class="text-decoration-none">Products</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${isEdit ? 'Edit Product' : 'New Product'}">Product Form</li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0 text-dark" th:text="${isEdit ? 'Edit Product' : 'Add New Product'}">Product Form</h3>
                <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back to Catalog
                </a>
            </div>

            <!-- Form Card -->
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-4">
                    <form th:action="${isEdit ? '/products/edit/' + productForm.id : '/products/new'}"
                          th:object="${productForm}"
                          method="post" class="row g-3">

                        <input type="hidden" th:field="*{id}" />

                        <!-- Product Name -->
                        <div class="col-12 col-md-8">
                            <label for="name" class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="e.g. Wireless Noise Canceling Headphones" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
                        </div>

                        <!-- Category -->
                        <div class="col-12 col-md-4">
                            <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                            <input list="categoryOptions" class="form-control" id="category" th:field="*{category}"
                                   th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''" placeholder="Select or type category" required>
                            <datalist id="categoryOptions">
                                <option th:each="c : ${categories}" th:value="${c}"></option>
                            </datalist>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Category error</div>
                        </div>

                        <!-- Price -->
                        <div class="col-12 col-md-6">
                            <label for="price" class="form-label fw-semibold">Unit Price ($) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" min="0.01" class="form-control" id="price" th:field="*{price}"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" required>
                            </div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price error</div>
                        </div>

                        <!-- Stock Quantity -->
                        <div class="col-12 col-md-6">
                            <label for="stockQuantity" class="form-label fw-semibold">Stock Quantity in Warehouse <span class="text-danger">*</span></label>
                            <input type="number" min="0" class="form-control" id="stockQuantity" th:field="*{stockQuantity}"
                                   th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}">Stock error</div>
                        </div>

                        <!-- Image URL -->
                        <div class="col-12">
                            <label for="imageUrl" class="form-label fw-semibold">Product Image URL (Optional)</label>
                            <input type="url" class="form-control" id="imageUrl" th:field="*{imageUrl}" placeholder="https://example.com/image.jpg">
                        </div>

                        <!-- Description -->
                        <div class="col-12">
                            <label for="description" class="form-label fw-semibold">Product Description</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="4" placeholder="Brief technical specifications and sales features..."></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="col-12 mt-4 pt-3 border-top d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check2-circle me-1"></i>
                                <span th:text="${isEdit ? 'Update Product' : 'Save Product'}">Save</span>
                            </button>
                            <a th:href="@{/products}" class="btn btn-light px-3">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/main :: scripts}"></div>
</body>
</html>
