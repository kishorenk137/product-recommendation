<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login - Customer Insights &amp; Preference Prediction</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31104b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            padding: 2.25rem 2rem 2rem;
            text-align: center;
            color: #ffffff;
        }
        .login-brand-icon {
            width: 58px;
            height: 58px;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            margin-bottom: 1rem;
        }
        .login-body {
            padding: 2.25rem 2rem;
        }
        .form-floating > .form-control:focus ~ label {
            color: #4f46e5;
        }
        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.15);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            border: none;
            padding: 0.85rem;
            font-weight: 600;
            border-radius: 0.65rem;
            transition: all 0.2s ease;
        }
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }
        .demo-credential-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="login-brand-icon">
            <i class="bi bi-graph-up-arrow"></i>
        </div>
        <h4 class="fw-bold mb-1">Customer Insights AI</h4>
        <p class="mb-0 text-white-50" style="font-size: 0.875rem;">Purchase Patterns &amp; Preference Prediction</p>
    </div>

    <div class="login-body">
        <!-- Error Alert -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3 py-2 px-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
            <small th:text="${errorMessage}">Invalid credentials</small>
        </div>

        <!-- Logout Alert -->
        <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center mb-3 py-2 px-3" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-6"></i>
            <small th:text="${successMessage}">Logged out successfully</small>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Username" required autofocus>
                <label for="username"><i class="bi bi-person me-2"></i>Administrator Username</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
            </div>

            <button type="submit" class="btn btn-primary btn-primary-custom w-100 text-white mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
            </button>
        </form>

        <!-- Demo Helper -->
        <div class="demo-credential-box mt-3 text-secondary">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <strong class="text-dark"><i class="bi bi-info-circle me-1 text-primary"></i> Demo Credentials:</strong>
                <button type="button" class="btn btn-link btn-sm p-0 text-primary fw-semibold" id="fillDemoBtn">
                    Auto-Fill
                </button>
            </div>
            <div>Username: <code class="text-primary fw-bold">admin</code></div>
            <div>Password: <code class="text-primary fw-bold">admin123</code></div>
        </div>
    </div>
</div>

<script>
    document.getElementById('fillDemoBtn').addEventListener('click', function() {
        document.getElementById('username').value = 'admin';
        document.getElementById('password').value = 'admin123';
    });
</script>
</body>
</html>
