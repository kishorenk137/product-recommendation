spring.application.name=customer-insights
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# Default profile is H2 for immediate, zero-setup local execution.
# For production MySQL, set SPRING_PROFILES_ACTIVE=mysql (configured in Docker, Render, VPS)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}


# Disable raw SQL script initialization (Hibernate ddl-auto and DataInitializer handle table creation & seeding)
spring.sql.init.mode=never

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Application Settings
app.data.seed-sample-data=true

# Logging
logging.level.com.analytics.customerinsights=INFO
logging.level.org.springframework.security=WARN
