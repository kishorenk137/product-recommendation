services:
  # Web Service
  - type: web
    name: customer-insights-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: mysql
      - key: DB_URL
        fromDatabase:
          name: customer-insights-mysql
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: customer-insights-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: customer-insights-mysql
          property: password

databases:
  # MySQL Database Service
  - name: customer-insights-mysql
    databaseName: customer_insights
    user: insights_admin
    region: oregon
    plan: free
