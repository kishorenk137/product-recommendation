version: '3.8'

services:
  # MySQL 8 Database Service
  db:
    image: mysql:8.0
    container_name: customer_insights_db
    restart: always
    environment:
      MYSQL_DATABASE: customer_insights
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_USER: insights_user
      MYSQL_PASSWORD: insights_password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  # Spring Boot 3 Web Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer_insights_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://db:3306/customer_insights?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: insights_user
      DB_PASSWORD: insights_password123
      PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
